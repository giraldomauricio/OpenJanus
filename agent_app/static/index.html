<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenJanus</title>
<link rel="icon" type="image/png" href="/logo.png">
<script>document.documentElement.dataset.theme = localStorage.theme || "dark";</script>
<style>
  /* Themes are just variable sets. "dark" (default) is :root; the others override it via <html data-theme="...">. */
  :root { --bg:#14161a; --panel:#1c1f26; --line:#2b303b; --text:#e6e8ec; --muted:#8b93a3; --accent:#7aa2ff;
          --ok:#4ade80; --bad:#f87171; --warn:#fbbf24;
          --code-bg:var(--code-bg); --user-bg:var(--user-bg); --on-accent:#0b1020; --on-warn:#000; --radius:10px; --radius-sm:6px; --pill:99px;
          --font:-apple-system, system-ui, sans-serif; --mono:ui-monospace, SFMono-Regular, Menlo, monospace;
          --glow:none; --card-shadow:none; --logo-filter:invert(1); color-scheme:dark; }
  :root[data-theme="light"] { --bg:#fbf8f3; --panel:#f1ece4; --line:#ded5c8; --text:#4a4458; --muted:#746c82; --accent:#8e9bef;
          --ok:#5fae8a; --bad:#d9778b; --warn:#d9a35f; --code-bg:#ece6f4; --user-bg:#dfe6fb; --on-accent:#2b2740; --on-warn:#2b2740;
          --card-shadow:0 1px 3px rgba(120,100,140,.12); --logo-filter:none; color-scheme:light; }
  :root[data-theme="hacker"] { --bg:#000800; --panel:#03120a; --line:#0f4a1f; --text:#33ff66; --muted:#1f9e45; --accent:#00ff9c;
          --ok:#33ff66; --bad:#ff4d4d; --warn:#ffd23f; --code-bg:#001a08; --user-bg:#06240f; --on-accent:#001a08; --on-warn:#001a08;
          --radius:0; --radius-sm:0; --pill:0; --font:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
          --glow:0 0 6px rgba(51,255,102,.45); --logo-filter:invert(1) sepia(1) saturate(7) hue-rotate(75deg) drop-shadow(0 0 4px rgba(51,255,102,.6)); color-scheme:dark; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text);
         font:14px/1.5 var(--font); }
  header { display:flex; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:15px; margin:0 auto 0 0; }
  select, input, button, textarea { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:var(--radius-sm);
         padding:6px 10px; font:inherit; }
  select:focus, input:focus, textarea:focus, button:focus-visible { outline:none; border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  header > * { flex-shrink:0; } header #history { flex:1 1 120px; min-width:0; } header #model { width:170px; min-width:0; }
  header button { white-space:nowrap; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
  button.danger { color:var(--bad); }
  main { flex:1; display:flex; min-height:0; }
  #chat { flex:1; display:flex; flex-direction:column; min-width:0; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:8px 12px; border-radius:var(--radius); white-space:pre-wrap; word-wrap:break-word; }
  .msg.md { white-space:normal; }
  .md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
  .md p { margin:6px 0; } .md h1, .md h2, .md h3, .md h4 { margin:12px 0 6px; line-height:1.3; text-transform:none; letter-spacing:0; color:var(--text); }
  .md h1 { font-size:18px; } .md h2 { font-size:16px; } .md h3, .md h4 { font-size:14px; }
  .md ul, .md ol { margin:6px 0; padding-left:22px; } .md li { margin:2px 0; }
  .md code, pre { font-family:var(--mono); }
  .md code { background:var(--code-bg); border-radius:var(--radius-sm); padding:1px 5px; font-size:12px; }
  .md pre { margin:8px 0; } .md pre code { background:none; padding:0; }
  .md blockquote { margin:6px 0; padding:2px 12px; border-left:3px solid var(--line); color:var(--muted); }
  .md table { margin:8px 0; display:block; overflow-x:auto; } .md th { background:var(--code-bg); }
  .md hr { border:0; border-top:1px solid var(--line); margin:10px 0; } .md a { color:var(--accent); }
  .user { align-self:flex-end; background:var(--user-bg); }
  .assistant { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .error { align-self:flex-start; color:var(--bad); border:1px solid var(--bad); }
  .warning { align-self:flex-start; color:var(--warn); border:1px solid var(--warn); font-size:12px; }
  details.tool { align-self:flex-start; max-width:80%; border:1px solid var(--line); border-radius:var(--radius); padding:4px 10px;
                 font-size:12px; color:var(--muted); }
  details.tool summary { cursor:pointer; } details.tool.fail summary { color:var(--bad); } details.tool.ok summary { color:var(--ok); }
  pre { margin:6px 0; padding:8px; background:var(--code-bg); border-radius:var(--radius-sm); overflow:auto; max-height:320px; font-size:12px; color:var(--text); }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; height:44px; }
  aside { width:400px; border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; border:0; border-radius:0; background:none; padding:10px; color:var(--muted); }
  .tabs button.on { color:var(--text); border-bottom:2px solid var(--accent); }
  .pane { flex:1; overflow-y:auto; padding:12px; display:none; } .pane.on { display:block; }
  .card { box-shadow:var(--card-shadow); border:1px solid var(--line); border-radius:var(--radius); padding:10px; margin-bottom:10px; background:var(--bg); }
  .card h4 { margin:0 0 4px; font-size:13px; } .card p { margin:4px 0; color:var(--muted); font-size:12px; }
  details.card > summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  details.card > summary::-webkit-details-marker { display:none; }
  details.card > summary::before { content:"▸"; color:var(--muted); width:10px; }
  details.card[open] > summary::before { content:"▾"; }
  details.card > summary h4 { margin:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  details.card > .body { margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
  .toolbar { display:flex; gap:6px; justify-content:flex-end; margin-bottom:8px; } .toolbar button { font-size:11px; padding:2px 8px; }
  .tblwrap { overflow:auto; max-height:360px; margin-top:8px; border:1px solid var(--line); border-radius:var(--radius-sm); }
  .tblwrap table { width:max-content; min-width:100%; }
  .tblwrap th { position:sticky; top:0; background:var(--code-bg); white-space:nowrap; }
  .tblwrap td { max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; vertical-align:top; }
  .tblwrap td.open { white-space:pre-wrap; word-break:break-word; max-width:360px; max-height:240px; overflow:auto; }
  .tblwrap td.null { color:var(--muted); font-style:italic; }
  .badge.builtin { color:var(--accent); border-color:var(--accent); } .badge.pending { color:var(--warn); border-color:var(--warn); }
  .badge.high { color:var(--bad); border-color:var(--bad); } .badge.medium { color:var(--warn); border-color:var(--warn); }
  .filters { display:flex; gap:6px; margin-bottom:8px; } .filters input { flex:1; min-width:0; }
  .finding { border-left:3px solid var(--line); padding:2px 8px; margin:6px 0; font-size:12px; }
  .finding.high { border-color:var(--bad); } .finding.medium { border-color:var(--warn); } .finding.low { border-color:var(--accent); }
  .finding p { margin:2px 0; } .params td:first-child { white-space:nowrap; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:var(--pill); border:1px solid var(--line); margin-right:4px; }
  .badge.network, .badge.database-write { color:var(--warn); border-color:var(--warn); }
  .row { display:flex; gap:6px; margin-top:8px; }
  h3 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:14px 0 8px; }
  .count { background:var(--warn); color:var(--on-warn); border-radius:var(--pill); padding:0 7px; font-size:11px; margin-left:6px; }
  table { border-collapse:collapse; width:100%; font-size:12px; } td, th { border-bottom:1px solid var(--line); padding:3px 6px; text-align:left; }
  /* "agent is working" indicator: always the last item in the chat log */
  .working { align-self:flex-start; display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; padding:4px 2px; }
  .working .dots { display:inline-flex; gap:4px; } .working .dots i { width:6px; height:6px; border-radius:50%; background:var(--accent);
         animation:pulse 1.2s infinite ease-in-out; } .working .dots i:nth-child(2) { animation-delay:.2s; } .working .dots i:nth-child(3) { animation-delay:.4s; }
  .working .t { font-variant-numeric:tabular-nums; opacity:.8; }
  @keyframes pulse { 0%, 80%, 100% { opacity:.2; transform:scale(.8); } 40% { opacity:1; transform:scale(1.15); } }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .working .dots i { animation:none; opacity:.8; } [data-theme="hacker"] .working .cursor { animation:none; } }
  [data-theme="hacker"] .working .dots { display:none; }
  [data-theme="hacker"] .working .cursor { display:inline-block; width:9px; height:1em; background:var(--accent); animation:blink 1s steps(1) infinite; }
  .working .cursor { display:none; }
  .logo { filter:var(--logo-filter); display:block; }
  header .logo { height:30px; width:auto; margin-right:-2px; }
  #welcome { margin:auto; text-align:center; max-width:440px; padding:20px; color:var(--muted); }
  #welcome .logo { height:110px; width:auto; margin:0 auto 14px; }
  #welcome h2 { margin:0 0 4px; color:var(--text); font-size:20px; } #welcome p { margin:4px 0 14px; }
  #welcome .chips { display:flex; flex-direction:column; gap:8px; } #welcome .chips button { text-align:left; color:var(--text); }
  body { text-shadow:var(--glow); }
  /* hacker: terminal look. Prompts replace bubbles; a faint scanline layer sits over everything but ignores the mouse. */
  [data-theme="hacker"] body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:9;
         background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0, rgba(0,0,0,.18) 1px, transparent 1px, transparent 3px); }
  [data-theme="hacker"] h1::before { content:"root@"; color:var(--muted); font-weight:400; }
  [data-theme="hacker"] h1::after { content:":~$"; color:var(--muted); margin-left:2px; }
  [data-theme="hacker"] .msg { max-width:92%; border:0; border-left:2px solid var(--line); background:none; padding:2px 10px; }
  [data-theme="hacker"] .msg.user { align-self:stretch; border-left-color:var(--accent); background:none; }
  [data-theme="hacker"] .msg.user::before { content:"$ "; color:var(--accent); font-weight:700; }
  [data-theme="hacker"] .msg.assistant { border-left-color:var(--ok); }
  [data-theme="hacker"] #input { caret-color:var(--accent); } [data-theme="hacker"] #input::placeholder { color:var(--muted); }
  [data-theme="hacker"] button { text-transform:lowercase; }
  [data-theme="hacker"] button:hover { background:var(--accent); color:var(--on-accent); text-shadow:none; }
  [data-theme="hacker"] button.primary { text-shadow:none; }
  [data-theme="hacker"] .md code, [data-theme="hacker"] pre { border:1px solid var(--line); }
  [data-theme="hacker"] a, [data-theme="hacker"] .md a { color:var(--accent); }
  [data-theme="hacker"] ::selection { background:var(--accent); color:var(--on-accent); text-shadow:none; }
  [data-theme="hacker"] ::-webkit-scrollbar { width:10px; height:10px; } [data-theme="hacker"] ::-webkit-scrollbar-thumb { background:var(--line); }
  [data-theme="hacker"] ::-webkit-scrollbar-track { background:var(--bg); }
</style>
</head>
<body>
<header>
  <img class="logo" src="/logo.png" alt="" width="30" height="30">
  <h1>OpenJanus</h1>
  <select id="provider"></select>
  <input id="model" list="models" placeholder="model" size="22">
  <datalist id="models"></datalist>
  <select id="theme" title="Theme"><option value="dark">◐ Dark</option><option value="light">☀ Pastel light</option><option value="hacker">▮ Hacker</option></select>
  <select id="history" title="Previous chats"></select>
  <button id="import">Import CSV…</button>
  <input type="file" id="file" accept=".csv,text/csv" hidden>
  <button id="new">New chat</button>
</header>
<main>
  <section id="chat">
    <div id="log"></div>
    <form id="form">
      <textarea id="input" placeholder="Ask about your data, or ask for a new tool…" autofocus></textarea>
      <button class="primary" id="send">Send</button>
    </form>
  </section>
  <aside>
    <div class="tabs">
      <button data-tab="approvals" class="on">Approvals<span id="pendingCount"></span></button>
      <button data-tab="capabilities">Capabilities</button>
      <button data-tab="database">Database</button>
    </div>
    <div class="pane on" id="approvals"></div>
    <div class="pane" id="capabilities"></div>
    <div class="pane" id="database"></div>
  </aside>
</main>
<script>
const TOKEN = "__TOKEN__";
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
let sessionId = null, cfg = null, busy = false;

// ---- minimal, safe markdown: everything is HTML-escaped first; only whitelisted tags are produced --------------
const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function inline(t) {
  const codes = [];
  t = t.replace(/`([^`]+)`/g, (_, c) => (codes.push(c), "\u0000" + (codes.length - 1) + "\u0000"));
  t = esc(t)
    .replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, (_, a, b) => "<strong>" + (a || b) + "</strong>")
    .replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + esc(codes[i]) + "</code>");
}
function renderMarkdown(src) {
  const lines = src.replace(/\r\n?/g, "\n").split("\n"), out = [];
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  for (let i = 0; i < lines.length;) {
    const l = lines[i];
    let m;
    if ((m = l.match(/^\s*```/))) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
    } else if (!l.trim()) { i++; }
    else if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { const n = Math.min(m[1].length, 4); out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; }
    else if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(l)) { out.push("<hr>"); i++; }
    else if (l.includes("|") && i + 1 < lines.length && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(lines[i + 1])) {
      const head = cells(l); i += 2; const rows = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
      out.push("<table><tr>" + head.map(c => `<th>${inline(c)}</th>`).join("") + "</tr>" +
        rows.map(r => "<tr>" + head.map((_, j) => `<td>${inline(r[j] ?? "")}</td>`).join("") + "</tr>").join("") + "</table>");
    } else if (/^\s*>/.test(l)) {
      const buf = []; while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push("<blockquote>" + renderMarkdown(buf.join("\n")) + "</blockquote>");
    } else if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      // list with nesting: lines indented deeper than the list's own indent belong to the previous item
      const itemRe = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/, base = l.match(/^\s*/)[0].length, ordered = /^\s*\d/.test(l);
      const start = ordered ? parseInt(l.trim(), 10) : 1, items = [];
      while (i < lines.length) {
        const ln = lines[i];
        if (!ln.trim()) {  // a blank line only continues the list if another item follows
          let j = i + 1; while (j < lines.length && !lines[j].trim()) j++;
          const nx = j < lines.length && lines[j].match(itemRe);
          if (nx && nx[1].length >= base) { i = j; continue; } else break;
        }
        const ind = ln.match(/^\s*/)[0].length, im = ln.match(itemRe);
        if (ind < base) break;
        if (ind === base) {
          if (!im || /\d/.test(im[2]) !== ordered) break;  // other list type or plain text: new block
          items.push({ text: im[3], sub: [] });
        } else items[items.length - 1].sub.push(ln);
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}${ordered && start !== 1 ? ` start="${start}"` : ""}>` + items.map(x => {
        const min = Math.min(...x.sub.map(z => z.match(/^\s*/)[0].length));
        return "<li>" + inline(x.text) + (x.sub.length ? renderMarkdown(x.sub.map(z => z.slice(min)).join("\n")) : "") + "</li>";
      }).join("") + `</${tag}>`);
    } else {
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^\s*(```|#{1,6}\s|>|([-*+]|\d+[.)])\s)/.test(lines[i])) buf.push(lines[i++]);
      if (!buf.length) buf.push(lines[i++]);
      out.push("<p>" + buf.map(inline).join("<br>") + "</p>");
    }
  }
  return out.join("");
}
function mdNode(text) { const d = el("div", "msg assistant md"); d.innerHTML = renderMarkdown(text); return d; }

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "X-Agent-Token": TOKEN, ...(opts.headers || {}) } });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r;
}

$("#theme").value = document.documentElement.dataset.theme;
$("#theme").onchange = () => { document.documentElement.dataset.theme = localStorage.theme = $("#theme").value; };

async function init() {
  cfg = await (await api("/api/config")).json();
  const sel = $("#provider");
  for (const [name, info] of Object.entries(cfg.providers)) {
    const o = el("option", "", name + (info.configured ? "" : " (no API key)")); o.value = name; sel.append(o);
  }
  sel.value = localStorage.provider || "claude";
  sel.onchange = () => { localStorage.provider = sel.value; setModel(); };
  setModel();
  $("#history").onchange = () => { const v = $("#history").value; if (v && !busy) openChat(v); };
  const last = (await (await api("/api/sessions")).json())[0];
  if (last) await openChat(last.id); else await newChat();
  await refreshApprovals(); await refreshCaps(); await refreshDb();
}
function setModel() {
  const p = $("#provider").value;
  $("#model").value = cfg.providers[p].model;
  const dl = $("#models"); dl.replaceChildren();
  if (p === "ollama") for (const m of cfg.ollama_models) { const o = el("option"); o.value = m; dl.append(o); }
}
async function newChat() {
  if (busy) return;
  sessionId = (await (await api("/api/sessions", { method: "POST" })).json()).id;
  $("#log").replaceChildren(); showWelcome(); await refreshHistory();
}
$("#new").onclick = newChat;
async function openChat(id) {
  const d = await (await api("/api/sessions/" + id)).json();
  sessionId = d.id; $("#log").replaceChildren();
  const tools = {};
  for (const ev of d.events) handle(ev, tools);
  await refreshHistory();
}
async function refreshHistory() {
  const list = await (await api("/api/sessions")).json(), sel = $("#history");
  sel.replaceChildren();
  const cur = el("option", "", list.some(x => x.id === sessionId) ? "History…" : "New chat (unsaved)"); cur.value = ""; sel.append(cur);
  for (const x of list) {
    const o = el("option", "", (x.id === sessionId ? "● " : "") + x.title + " — " + new Date(x.updated * 1000).toLocaleString());
    o.value = x.id; sel.append(o);
  }
  sel.value = "";
}


function prefill(text) { $("#input").value = text; $("#input").focus(); }
$("#import").onclick = () => $("#file").click();
$("#file").onchange = async () => {
  const f = $("#file").files[0]; if (!f) return;
  const suggested = f.name.replace(/\.csv$/i, "").replace(/[^A-Za-z0-9]+/g, "_");
  const name = prompt("Table name for this CSV:", suggested); $("#file").value = "";
  if (!name) return;
  try {
    const r = await (await api("/api/import/csv?table=" + encodeURIComponent(name),
      { method: "POST", body: await f.text(), headers: { "Content-Type": "text/csv" } })).json();
    add(el("div", "msg assistant", `Imported ${r.rows} rows into table "${r.table}" (${r.columns.map(c => c.name + ":" + c.declared_type).join(", ")}).`));
    prefill(`I imported a table called ${r.table}. Learn it: profile it, adopt it as a model, look for relationships with my other tables, and tell me what you found.`);
    document.querySelector('[data-tab="database"]').click(); refreshDb();
  } catch (e) { alert("Import failed: " + e.message); }
};

function showWelcome() {
  const w = el("div"); w.id = "welcome";
  const img = el("img", "logo"); img.src = "/logo.png"; img.alt = "OpenJanus";
  w.append(img, el("h2", "", "OpenJanus"), el("p", "", "Work with your local database, and let the agent propose its own tools and skills."));
  const chips = el("div", "chips");
  for (const t of ["What can you do? List your tools and skills.", "What tables are in my database?",
                   "Review your tools and skills for overlap, then review my database."]) {
    const b = el("button", "", t); b.type = "button"; b.onclick = () => prefill(t); chips.append(b);
  }
  w.append(chips); $("#log").append(w);
}
function add(node) {
  $("#welcome")?.remove();
  const log = $("#log"), w = $("#working");
  w ? log.insertBefore(node, w) : log.append(node);  // the working indicator stays last
  log.scrollTop = log.scrollHeight; return node;
}

// Shows that the agent is busy: animated dots, what it is doing, and elapsed time (local models can take minutes).
let workTimer = null, workStart = 0, workLabel = "";
function showWorking(label) {
  workStart = Date.now();
  const w = el("div", "working"); w.id = "working"; w.setAttribute("role", "status"); w.setAttribute("aria-live", "polite");
  const dots = el("span", "dots"); dots.append(el("i"), el("i"), el("i"));
  w.append(dots, el("span", "cursor"), el("span", "label"), el("span", "t"));
  $("#log").append(w); setWorking(label);
  const tick = () => { const sec = Math.floor((Date.now() - workStart) / 1000);
    $("#working .t").textContent = sec >= 60 ? `${Math.floor(sec / 60)}m ${String(sec % 60).padStart(2, "0")}s` : sec + "s"; };
  tick(); workTimer = setInterval(tick, 1000);
  document.title = "⏳ OpenJanus"; $("#log").scrollTop = $("#log").scrollHeight;
}
function setWorking(label) { const l = $("#working .label"); if (l) { workLabel = label; l.textContent = label; } }
function hideWorking() { clearInterval(workTimer); workTimer = null; $("#working")?.remove(); document.title = "OpenJanus"; }

function toolNode(ev) {
  const d = el("details", "tool");
  d.append(el("summary", "", "⚙ " + ev.name + "(…)"));
  d.append(el("pre", "", JSON.stringify(ev.args, null, 2)));
  return d;
}

async function send(text) {
  busy = true; $("#send").disabled = true;
  add(el("div", "msg user", text));
  const tools = {}, model = $("#model").value.trim() || $("#provider").value;
  showWorking(`Waiting for ${model}…`);
  try {
    const r = await api("/api/chat", { method: "POST", body: JSON.stringify({
      session_id: sessionId, message: text, provider: $("#provider").value, model: $("#model").value.trim() || null }) });
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (line.startsWith("data: ")) handle(JSON.parse(line.slice(6)), tools);
      }
    }
  } catch (e) { add(el("div", "msg error", String(e.message || e))); }
  hideWorking();
  busy = false; $("#send").disabled = false; refreshHistory(); refreshApprovals(); refreshCaps(); refreshDb(); $("#input").focus();
}

function handle(ev, tools) {
  if (ev.type === "user") add(el("div", "msg user", ev.text));
  else if (ev.type === "text") { add(mdNode(ev.text)); setWorking(`Waiting for ${$("#model").value.trim() || $("#provider").value}…`); }
  else if (ev.type === "error") add(el("div", "msg error", ev.text));
  else if (ev.type === "warning") add(el("div", "msg warning", "⚠ " + ev.text));
  else if (ev.type === "tool_call") { tools[ev.id] = add(toolNode(ev)); setWorking(`Running ${ev.name}…`); }
  else if (ev.type === "tool_result") {
    setWorking(`Waiting for ${$("#model").value.trim() || $("#provider").value}…`);
    const d = tools[ev.id]; if (!d) return;
    d.classList.add(ev.ok ? "ok" : "fail");
    d.querySelector("summary").textContent = (ev.ok ? "✓ " : "✗ ") + ev.name;
    d.append(el("pre", "", ev.content));
    if (ev.name.startsWith("propose_") && ev.ok) { refreshApprovals(); refreshCaps(); }
  }
}

$("#form").onsubmit = e => { e.preventDefault(); const t = $("#input").value.trim(); if (!t || busy) return; $("#input").value = ""; send(t); };
$("#input").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#form").requestSubmit(); } };

// ---- sidebar -------------------------------------------------------------
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button, .pane").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); $("#" + b.dataset.tab).classList.add("on");
});

// Collapsible cards. Open/closed state survives the sidebar re-renders that happen after every chat turn.
const openKeys = new Set(JSON.parse(localStorage.openKeys || "[]"));
function collapsible(key, summaryNodes, bodyNodes, onOpen) {
  const d = el("details", "card"), sum = el("summary"), body = el("div", "body");
  d.dataset.key = key; sum.append(...summaryNodes); body.append(...bodyNodes); d.append(sum, body);
  let last = 0; const open = () => { if (Date.now() - last > 300) { last = Date.now(); onOpen && onOpen(); } };  // de-dupe
  d.open = openKeys.has(key);
  d.addEventListener("toggle", () => {
    d.open ? openKeys.add(key) : openKeys.delete(key);
    localStorage.openKeys = JSON.stringify([...openKeys]);
    if (d.open) open();
  });
  if (d.open) open();
  return d;
}
function toolbar(pane) {
  const bar = el("div", "toolbar"), all = (open) => () => pane.querySelectorAll("details.card").forEach(d => { d.open = open; });
  const a = el("button", "", "Expand all"), b = el("button", "", "Collapse all");
  a.onclick = all(true); b.onclick = all(false); bar.append(a, b); return bar;
}

function itemCard(it, pending) {
  const key = `${it.status}:${it.kind}:${it.name}`;
  const head = [el("h4", "", `${it.kind === "tool" ? "🔧" : "📘"} ${it.name}`)];
  for (const cap of it.capabilities || []) if (cap === "network" || cap === "database-write") head.push(el("span", "badge " + cap, cap));
  const body = [el("p", "", it.description || "")];
  if (it.rationale) body.push(el("p", "", "Why: " + it.rationale));
  const caps = el("div");
  for (const cap of it.capabilities || []) caps.append(el("span", "badge " + cap, cap));
  if (it.kind === "tool" && !(it.capabilities || []).length) caps.append(el("span", "badge", "no network / no db"));
  body.push(caps);
  const src = el("pre"); src.style.display = "none"; body.push(src);
  const row = el("div", "row");
  const view = el("button", "", "View source");
  view.onclick = async () => {
    if (src.style.display === "none") {
      src.textContent = (await (await api(`/api/extensions/${it.kind}/${it.name}/source?status=${it.status}`)).json()).source;
      src.style.display = "block"; view.textContent = "Hide source";
    } else { src.style.display = "none"; view.textContent = "View source"; }
  };
  row.append(view);
  if (pending) {
    const ok = el("button", "primary", "Approve"), no = el("button", "danger", "Reject");
    const act = a => async () => {
      if (a === "approve" && !confirm(`Approve ${it.kind} "${it.name}"?\n\nOnce approved it becomes available to the agent` +
          (it.kind === "tool" ? " and its code will run on this machine." : "."))) return;
      try { await api(`/api/extensions/${it.kind}/${it.name}/${a}`, { method: "POST" }); } catch (e) { alert(e.message); }
      openKeys.delete(key); refreshApprovals(); refreshCaps();
    };
    ok.onclick = act("approve"); no.onclick = act("reject"); row.append(ok, no);
  }
  body.push(row);
  return collapsible(key, head, body);
}


// ---- capabilities tab ------------------------------------------------------------------------------------------
let capFilter = { q: "", kind: "all" }, capData = null;
const originBadge = x => el("span", "badge " + (x.origin === "builtin" ? "builtin" : ""), x.origin === "builtin" ? "built-in" : "generated");

function capTool(t) {
  const head = [el("h4", "", "🔧 " + t.name), originBadge(t)];
  if (t.status === "pending") head.push(el("span", "badge pending", "pending"));
  head.push(el("span", "badge", t.uses + " uses"));
  const body = [el("p", "", t.description)];
  if (t.params.length) {
    const tbl = el("table", "params");
    for (const p of t.params) {
      const tr = el("tr"); tr.append(el("td", "", p.name + (p.required ? " *" : "")), el("td", "", p.type), el("td", "", p.description)); tbl.append(tr);
    }
    body.push(tbl);
  } else if (t.status === "active") body.push(el("p", "", "No parameters."));
  if (t.capabilities.length) { const d = el("div"); t.capabilities.forEach(c => d.append(el("span", "badge " + c, c))); body.push(d); }
  body.push(el("p", "", t.used_by_skills.length ? "Used by skills: " + t.used_by_skills.join(", ") : "Not referenced by any skill."));
  return collapsible("cap:tool:" + t.name, head, body);
}
function capSkill(s) {
  const head = [el("h4", "", "📘 " + s.name), originBadge(s)];
  if (s.status === "pending") head.push(el("span", "badge pending", "pending"));
  const body = [el("p", "", s.description), el("p", "", s.tools.length ? "Tools: " + s.tools.join(", ") : "No tools listed.")];
  if (s.status === "active") {
    const pre = el("pre"); pre.style.display = "none"; const b = el("button", "", "View instructions");
    b.onclick = async () => {
      if (pre.style.display === "none") { pre.textContent = (await (await api("/api/skills/" + s.name)).json()).instructions; pre.style.display = "block"; b.textContent = "Hide instructions"; }
      else { pre.style.display = "none"; b.textContent = "View instructions"; }
    };
    body.push(b, pre);
  }
  return collapsible("cap:skill:" + s.name, head, body);
}
function renderFindings(box, title, r) {
  const sm = r.summary, head = [el("h4", "", title), ...["high", "medium", "low", "info"].filter(k => sm[k]).map(k => el("span", "badge " + k, sm[k] + " " + k))];
  const body = r.findings.length ? r.findings.map(f => {
    const d = el("div", "finding " + f.severity);
    d.append(el("p", "", `${f.severity.toUpperCase()} · ${f.kind} · ${f.subjects.join(" ↔ ")}`), el("p", "", f.detail));
    if (f.suggestion) d.append(el("p", "", "→ " + f.suggestion)); return d;
  }) : [el("p", "", "No findings.")];
  const card = collapsible("audit:" + title, head, body); card.open = true; box.replaceChildren(card);
}
async function runAudit(kind, box, btn) {
  btn.disabled = true; box.replaceChildren(el("p", "", "Auditing…"));
  try { renderFindings(box, kind === "database" ? "Database audit" : "Capabilities audit", await (await api("/api/audit/" + kind)).json()); }
  catch (e) { box.replaceChildren(el("p", "", "Audit failed: " + e.message)); }
  btn.disabled = false;
}
function drawCaps() {
  const list = $("#capList"); if (!list || !capData) return; list.replaceChildren();
  const q = capFilter.q.toLowerCase(), hit = x => !q || (x.name + " " + x.description).toLowerCase().includes(q);
  const tools = capData.tools.filter(hit), skills = capData.skills.filter(hit);
  if (capFilter.kind !== "skills") { list.append(el("h3", "", `Tools (${tools.length})`)); tools.forEach(t => list.append(capTool(t))); }
  if (capFilter.kind !== "tools") { list.append(el("h3", "", `Skills (${skills.length})`)); skills.forEach(s => list.append(capSkill(s))); }
  capData.load_problems.forEach(p => list.append(el("div", "msg warning", p)));
}
async function refreshCaps() {
  const pane = $("#capabilities");
  if (!$("#capList")) {
    const filters = el("div", "filters"), q = el("input"), kind = el("select");
    q.placeholder = "Filter by name or description…"; q.oninput = () => { capFilter.q = q.value; drawCaps(); };
    for (const k of ["all", "tools", "skills"]) { const o = el("option", "", k); o.value = k; kind.append(o); }
    kind.onchange = () => { capFilter.kind = kind.value; drawCaps(); }; filters.append(q, kind);
    const box = el("div"), row = el("div", "row"); row.style.marginBottom = "8px";
    const a = el("button", "", "Audit tools & skills"), b = el("button", "", "Audit database"), c = el("button", "primary", "Ask agent to review");
    a.onclick = () => runAudit("capabilities", box, a); b.onclick = () => runAudit("database", box, b);
    c.onclick = () => prefill("Review yourself: check your tools and skills for overlap or redundancy and tell me what could be optimized. Then review my database and report what you find.");
    row.append(a, b, c);
    const list = el("div"); list.id = "capList";
    pane.replaceChildren(filters, row, box, toolbar(list), list);
  }
  capData = await (await api("/api/capabilities")).json(); drawCaps();
}

async function refreshApprovals() {
  const d = await (await api("/api/extensions")).json();
  const pane = $("#approvals"); pane.replaceChildren();
  $("#pendingCount").replaceChildren(); if (d.pending.length) $("#pendingCount").append(el("span", "count", d.pending.length));
  pane.append(toolbar(pane));
  pane.append(el("h3", "", "Pending review"));
  if (!d.pending.length) pane.append(el("p", "", "Nothing waiting. Ask the agent for a new tool or skill."));
  d.pending.forEach(i => pane.append(itemCard(i, true)));
  for (const p of d.problems) pane.append(el("div", "msg warning", p));
  pane.append(el("h3", "", "Approved"));
  if (!d.approved.length) pane.append(el("p", "", "None yet."));
  d.approved.forEach(i => pane.append(itemCard(i, false)));
}

function cellNode(v) {
  const td = el("td");
  if (v === null || v === undefined) { td.className = "null"; td.textContent = "NULL"; return td; }
  const full = typeof v === "object" ? JSON.stringify(v) : String(v);
  td.textContent = full.length > 5000 ? full.slice(0, 5000) + "… [" + full.length + " chars]" : full;
  td.title = full.length > 300 ? full.slice(0, 300) + "…" : full;
  td.onclick = () => td.classList.toggle("open");  // click a cell to read all of it
  return td;
}
async function loadPreview(table, out) {
  try {
    const r = await (await api("/api/db/" + encodeURIComponent(table))).json();
    const tbl = el("table"), head = el("tr");
    r.preview.columns.forEach(h => head.append(el("th", "", h))); tbl.append(head);
    r.preview.rows.forEach(row => { const tr = el("tr"); r.preview.columns.forEach(h => tr.append(cellNode(row[h]))); tbl.append(tr); });
    const wrap = el("div", "tblwrap"); wrap.append(tbl);
    out.replaceChildren(el("p", "", `First ${r.preview.rows.length} rows. Click a cell to expand it.`), wrap);
  } catch (e) { out.replaceChildren(el("p", "", "Could not load: " + e.message)); }
}

async function refreshDb() {
  const d = await (await api("/api/db")).json();
  const pane = $("#database"); pane.replaceChildren();
  if (!d.tables.length) { pane.append(el("p", "", "No tables yet.")); return; }
  pane.append(toolbar(pane));
  for (const t of d.tables) {
    const head = [el("h4", "", t.table), el("span", "badge", `${t.rows} rows`)];
    if (!t.managed) head.push(el("span", "badge database-write", "no model"));
    const body = [], out = el("div");
    if (!t.managed) {
      body.push(el("p", "", "No model yet: read-only for the agent until it is adopted."));
      const learn = el("button", "", "Ask agent to learn this table");
      learn.onclick = () => prefill(`Learn the table ${t.table}: profile it, adopt it as a model, look for relationships with my other tables, and tell me what you found.`);
      body.push(learn);
    }
    body.push(out);
    pane.append(collapsible("table:" + t.table, head, body, () => loadPreview(t.table, out)));
  }
}
init().catch(e => add(el("div", "msg error", String(e))));
</script>
</body>
